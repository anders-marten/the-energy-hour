  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      padding-bottom: 104px;
      box-sizing: border-box;
      background: #000000;
      font-family: sans-serif;
    }
    main {
      width: min(90vw, 640px);
      display: grid;
      gap: 18px;
    }
    img,
    .embed-container {
      max-width: min(90vw, 640px);
      width: 100%;
      display: block;
      margin: 0 auto;
    }
    img {
      height: auto;
    }
    .embed-container {
      aspect-ratio: 1 / 1;
      position: relative;
    }
    .embed-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .playlist-button {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 56px;
      height: 56px;
      padding: 8px;
      border: 0;
      border-radius: 50%;
      background: rgb(0 0 0 / 44%);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      transition: background 160ms ease, transform 160ms ease;
    }
    .playlist-button:hover,
    .playlist-button:focus-visible {
      background: rgb(0 0 0 / 68%);
      transform: translateY(-50%) scale(1.04);
    }
    .playlist-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 3px;
    }
    .playlist-button:disabled {
      cursor: default;
      opacity: 0.34;
      transform: translateY(-50%);
    }
    .playlist-button:disabled:hover {
      background: rgb(0 0 0 / 44%);
      transform: translateY(-50%);
    }
    .playlist-button img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      pointer-events: none;
      display: block;
      margin: 0;
    }
    .playlist-button.previous {
      left: 16px;
    }
    .playlist-button.previous img {
      transform: translateX(8px);
    }
    .playlist-button.next {
      right: 16px;
    }
    .playlist-button.next img {
      transform: translateX(4px);
    }
    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      width: 92px;
      height: 92px;
      padding: 18px;
      border: 0;
      border-radius: 50%;
      background: rgb(0 0 0 / 58%);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }
    .play-button:hover,
    .play-button:focus-visible {
      background: rgb(0 0 0 / 76%);
      transform: translate(-50%, -50%) scale(1.04);
    }
    .play-button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }
    .play-button img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      pointer-events: none;
      transform: translateX(4px);
    }
    .play-button.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .artist-intro {
      color: #ffffff;
      text-align: center;
    }
    .artist-intro h1 {
      margin: 0;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      letter-spacing: 0;
    }
    .artist-intro p {
      margin: 8px auto 0;
      max-width: 58ch;
      color: rgb(255 255 255 / 72%);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .social-links {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(90%, 600px);
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
    }
    .social-links a {
      min-width: 0;
      height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .social-links img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    @media (max-width: 520px) {
      .playlist-button {
        width: 48px;
        height: 48px;
        padding: 6px;
      }
      .playlist-button.previous {
        left: 10px;
      }
      .playlist-button.next {
        right: 10px;
      }
      .play-button {
        width: 78px;
        height: 78px;
        padding: 14px;
      }
      .play-button img {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="embed-container">
      <iframe id="soundcloud-player" title="SoundCloud player" scrolling="no" frameborder="no" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2304212519&color=%23ff5500&auto_play=false&hide_related=true&show_comments=true&show_user=true&show_reposts=false&show_teaser=false&visual=true"></iframe>
      <button class="playlist-button previous" type="button" aria-label="Previous track">
        <img src="/images/arrow_back.svg" alt="" aria-hidden="true" />
      </button>
      <button class="playlist-button next" type="button" aria-label="Next track">
        <img src="/images/arrow_forward.svg" alt="" aria-hidden="true" />
      </button>
      <button class="play-button" type="button" aria-label="Play track">
        <img src="/images/play_arrow.svg" alt="" aria-hidden="true" style="margin-right: 5px;" />
      </button>
    </div>
    <section class="artist-intro" aria-labelledby="artist-title">
      <h1 id="artist-title">The Energy Hour</h1>
      <p>Music with themes ranging from outer space to my heart.<br>
From the nineties until now, I’ve been making electronic music, blending rave roots, synth textures, funk, pop, and AI-assisted arrangements.
</p>
    </section>
  </main>
  <nav class="social-links" aria-label="Artist social links">
    <a href="https://open.spotify.com/artist/0QpQBk3Gu2aW99YiDHOBLe?si=dKN4cefASNOYD81G93tKgA" target="_blank" rel="noopener noreferrer" aria-label="Spotify">
      <img src="/images/spotify.png" alt="Spotify" />
      <div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
    </a>
    <a href="https://soundcloud.com/the_energy_hour" target="_blank" rel="noopener noreferrer" aria-label="SoundCloud">
      <img src="/images/soundcloud-2.png" alt="SoundCloud" style="height: 200%;"/>
    </a>
    <a href="https://ungap.com/" target="_blank" rel="noopener noreferrer" aria-label="Ungap">
      <img src="/images/ungap-icon-logo.png" alt="ungap" style="height: 140%;"/>
    </a>
  </nav>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    const fallbackPlaylist = [
      { title: "Track 1", id: "2304212519" }
    ];

    const player = document.querySelector("#soundcloud-player");
    const previousButton = document.querySelector(".playlist-button.previous");
    const nextButton = document.querySelector(".playlist-button.next");
    const playButton = document.querySelector(".play-button");
    let widget = SC.Widget(player);
    let playlist = fallbackPlaylist;
    let shuffledPlaylist = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let playlistComplete = false;
    let playerStateTimer = 0;
    let isAdvancingAfterFinish = false;

    function buildSoundCloudSrc(trackId, autoPlay = false) {
      return "https://w.soundcloud.com/player/?" +
        `url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A${encodeURIComponent(trackId)}` +
        "&color=%23ff5500" +
        `&auto_play=${autoPlay ? "true" : "false"}` +
        "&hide_related=true" +
        "&show_comments=true" +
        "&show_user=true" +
        "&show_reposts=false" +
        "&show_teaser=false" +
        "&visual=true";
    }

    function updatePlayButton() {
      playButton.classList.toggle("is-hidden", isPlaying);
    }

    function updatePlaylistButtons() {
      previousButton.disabled = currentTrackIndex <= 0;
      nextButton.disabled = currentTrackIndex >= shuffledPlaylist.length - 1;
    }

    function syncPlayerState() {
      widget.isPaused((paused) => {
        isPlaying = !paused;
        updatePlayButton();
        updatePlaylistButtons();
      });
    }

    function checkTrackFinished() {
      widget.getDuration((duration) => {
        if (!duration || isAdvancingAfterFinish) {
          return;
        }

        widget.getPosition((position) => {
          const remainingTime = duration - position;
          const isAtEnd = position > 0 && remainingTime <= 1000;

          if (isAtEnd) {
            handleTrackFinished();
          }
        });
      });
    }

    function startPlayerStatePolling() {
      window.clearInterval(playerStateTimer);
      playerStateTimer = window.setInterval(() => {
        syncPlayerState();
        checkTrackFinished();
      }, 1000);
    }

    function handleTrackFinished() {
      if (isAdvancingAfterFinish) {
        return;
      }

      isAdvancingAfterFinish = true;
      showForwardTrack(true);
    }

    function shuffleTracks(tracks) {
      const shuffledTracks = [...tracks];

      for (let index = shuffledTracks.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        const currentTrack = shuffledTracks[index];

        shuffledTracks[index] = shuffledTracks[randomIndex];
        shuffledTracks[randomIndex] = currentTrack;
      }

      return shuffledTracks;
    }

    function showTrack(index, shouldPlay = false) {
      if (!shuffledPlaylist.length) {
        return;
      }

      currentTrackIndex = index;
      const track = shuffledPlaylist[currentTrackIndex];
      isAdvancingAfterFinish = false;

      player.src = buildSoundCloudSrc(track.id, shouldPlay);
      widget = SC.Widget(player);
      bindWidgetEvents();
      startPlayerStatePolling();
      player.title = track.title ? `SoundCloud player: ${track.title}` : "SoundCloud player";
      isPlaying = shouldPlay;
      updatePlayButton();
      updatePlaylistButtons();
    }

    function showInitialTrack() {
      shuffledPlaylist = shuffleTracks(playlist);
      currentTrackIndex = 0;
      showTrack(currentTrackIndex, false);
    }

    function showPreviousTrack(shouldPlay = isPlaying) {
      if (currentTrackIndex <= 0) {
        return;
      }

      showTrack(currentTrackIndex - 1, shouldPlay);
    }

    function showForwardTrack(shouldPlay = isPlaying) {
      if (currentTrackIndex >= shuffledPlaylist.length - 1) {
        isPlaying = false;
        playlistComplete = true;
        updatePlayButton();
        updatePlaylistButtons();
        return;
      }

      showTrack(currentTrackIndex + 1, shouldPlay);
    }

    function normalizePlaylist(items) {
      if (!Array.isArray(items)) {
        return [];
      }

      return items
        .map((item) => ({
          title: typeof item.title === "string" ? item.title : "",
          id: String(item.id || "").trim()
        }))
        .filter((item) => item.id);
    }

    async function loadPlaylist() {
      try {
        const response = await fetch("/playlist.json", { cache: "no-cache" });

        if (!response.ok) {
          throw new Error(`Playlist request failed with ${response.status}`);
        }

        const loadedPlaylist = normalizePlaylist(await response.json());
        playlist = loadedPlaylist.length ? loadedPlaylist : fallbackPlaylist;
      } catch (error) {
        console.warn("Using fallback playlist.", error);
      }

      showInitialTrack();
    }

    previousButton.addEventListener("click", () => {
      showPreviousTrack(isPlaying);
    });

    nextButton.addEventListener("click", () => {
      showForwardTrack(isPlaying);
    });

    playButton.addEventListener("click", () => {
      if (playlistComplete) {
        return;
      }

      isPlaying = true;
      updatePlayButton();
      widget.play();
    });

    function bindWidgetEvents() {
      widget.bind(SC.Widget.Events.READY, () => {
        syncPlayerState();
        startPlayerStatePolling();
      });

      widget.bind(SC.Widget.Events.PLAY, () => {
        isPlaying = true;
        updatePlayButton();
      });

      widget.bind(SC.Widget.Events.PAUSE, () => {
        syncPlayerState();
      });

      widget.bind(SC.Widget.Events.FINISH, () => {
        handleTrackFinished();
      });
    }

    loadPlaylist();
  </script>
</body>
</html>
