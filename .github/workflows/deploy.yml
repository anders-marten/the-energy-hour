name: Deploy to Scaleway

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: the-energy-hour-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync production bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_DEPLOY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_DEPLOY_SECRET_KEY }}
          AWS_DEFAULT_REGION: fr-par
        run: |
          aws s3 sync dist/ s3://${{ secrets.SCW_BUCKET_NAME }}/ \
            --delete \
            --endpoint-url https://s3.fr-par.scw.cloud
          # Text files (llms.txt, robots.txt, lyrics) need an explicit UTF-8
          # charset, otherwise browsers may show å, ä and ö garbled.
          aws s3 cp dist/ s3://${{ secrets.SCW_BUCKET_NAME }}/ \
            --recursive --exclude "*" --include "*.txt" \
            --content-type "text/plain; charset=utf-8" \
            --endpoint-url https://s3.fr-par.scw.cloud

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh

      - name: Purge Edge Services cache
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_DEPLOY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_DEPLOY_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: 4ee114eb-0bd3-4132-a3a6-41b583031ad0
          SCW_DEFAULT_REGION: fr-par
        run: |
          scw edge-services purge-request create \
            pipeline-id=${{ secrets.SCW_EDGE_PIPELINE_ID }} \
            all=true

      # CloudFront serves the apex domain in front of Edge Services and caches
      # files for up to a day, so it is purged too. The role can only
      # invalidate this one distribution (GitHub OIDC, main branch only).
      - name: Configure AWS credentials for CloudFront
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INVALIDATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Purge CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query Invalidation.Id --output text
